org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Pin the JDK so ./gradlew works even when JAVA_HOME is not exported in the shell (e.g. a fresh
# PowerShell window). Path is host-specific; keep in sync with the JDK at C:\Program Files\Microsoft\.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-21.0.12.8-hotspot
